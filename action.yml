name: 'md2pdf-th'
description: 'Convert Markdown to PDF — Thai/English support, templates, watermark, TOC, cover page'
author: 'Teepakorn Kumvong'
branding:
  icon: 'file-text'
  color: 'blue'
inputs:
  markdown-file:
    description: 'Path to markdown file'
    required: true
  output-file:
    description: 'Output PDF path'
    required: false
  theme:
    description: 'Theme: light or dark'
    required: false
    default: 'light'
  format:
    description: 'Page size (A4, Letter, A3, A5, Legal, Tabloid)'
    required: false
    default: 'A4'
  toc:
    description: 'Generate Table of Contents (true/false)'
    required: false
    default: 'false'
  cover:
    description: 'Add cover page from frontmatter (true/false)'
    required: false
    default: 'false'
  template:
    description: 'Built-in template (resume, report, invoice)'
    required: false
    default: ''
  watermark:
    description: 'Diagonal watermark text'
    required: false
    default: ''
  header:
    description: 'Custom header text'
    required: false
    default: ''
  footer:
    description: 'Custom footer text'
    required: false
    default: ''
  font:
    description: 'Custom font family'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - name: Install md2pdf-th
      shell: bash
      run: npm install -g md2pdf-th
    - name: Convert Markdown to PDF
      shell: bash
      env:
        INPUT_THEME: ${{ inputs.theme }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_TOC: ${{ inputs.toc }}
        INPUT_COVER: ${{ inputs.cover }}
        INPUT_TEMPLATE: ${{ inputs.template }}
        INPUT_WATERMARK: ${{ inputs.watermark }}
        INPUT_HEADER: ${{ inputs.header }}
        INPUT_FOOTER: ${{ inputs.footer }}
        INPUT_FONT: ${{ inputs.font }}
        INPUT_MARKDOWN_FILE: ${{ inputs.markdown-file }}
        INPUT_OUTPUT_FILE: ${{ inputs.output-file }}
      run: |
        ARGS=()
        [ "$INPUT_THEME" != "light" ] && ARGS+=(--theme "$INPUT_THEME")
        [ "$INPUT_FORMAT" != "A4" ] && ARGS+=(--format "$INPUT_FORMAT")
        [ "$INPUT_TOC" = "true" ] && ARGS+=(--toc)
        [ "$INPUT_COVER" = "true" ] && ARGS+=(--cover)
        [ -n "$INPUT_TEMPLATE" ] && ARGS+=(--template "$INPUT_TEMPLATE")
        [ -n "$INPUT_WATERMARK" ] && ARGS+=(--watermark "$INPUT_WATERMARK")
        [ -n "$INPUT_HEADER" ] && ARGS+=(--header "$INPUT_HEADER")
        [ -n "$INPUT_FOOTER" ] && ARGS+=(--footer "$INPUT_FOOTER")
        [ -n "$INPUT_FONT" ] && ARGS+=(--font "$INPUT_FONT")
        if [ -n "$INPUT_OUTPUT_FILE" ]; then
          md2pdf-th "${ARGS[@]}" "$INPUT_MARKDOWN_FILE" "$INPUT_OUTPUT_FILE"
        else
          md2pdf-th "${ARGS[@]}" "$INPUT_MARKDOWN_FILE"
        fi
